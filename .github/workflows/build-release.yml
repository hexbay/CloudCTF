name: Build and Release

on:
  push:
    tags:
      - 'v*'  # 当推送 tag 时触发，如 v1.0.0
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git branch, tag, or commit to build
        required: true
        default: main
      image_tag:
        description: Docker image tag (for example 1.0.0 or latest)
        required: true
        default: latest

permissions:
  contents: write

env:
  DOCKERHUB_USERNAME: peach0214
  DOCKER_IMAGE: peach0214/cloud_ctf

jobs:
  # 提取版本号（其他 jobs 依赖）
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_ref: ${{ steps.version.outputs.source_ref }}
      docker_tags: ${{ steps.version.outputs.docker_tags }}
    steps:
      - name: Extract version from tag
        id: version
        env:
          DISPATCH_SOURCE_REF: ${{ inputs.source_ref }}
          DISPATCH_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            SOURCE_REF=${GITHUB_REF#refs/tags/}
            VERSION=${SOURCE_REF#v}
          else
            SOURCE_REF=${DISPATCH_SOURCE_REF}
            VERSION=${DISPATCH_IMAGE_TAG}
          fi

          if [[ ! "$VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker image tag: $VERSION" >&2
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "source_ref=$SOURCE_REF" >> $GITHUB_OUTPUT
          {
            echo 'docker_tags<<EOF'
            echo "${DOCKER_IMAGE}:${VERSION}"
            if [[ "$VERSION" != "latest" ]]; then
              echo "${DOCKER_IMAGE}:latest"
            fi
            echo 'EOF'
          } >> $GITHUB_OUTPUT
          echo "Source: $SOURCE_REF; image tag: $VERSION"

  # 构建单一 Docker 镜像（多阶段：内嵌统一前端的 Go 二进制）
  build-image:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push server image (frontend embedded)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ needs.prepare.outputs.docker_tags }}
          platforms: linux/amd64
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache,mode=max

  # 编译单一二进制产物（统一前端 embed 进 Go 二进制），多平台并行
  build-binaries:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build unified frontend
        run: |
          cd frontend
          npm ci
          npm run build
          echo "✅ 统一前端构建完成"

      - name: Embed frontend into backend
        run: |
          rm -rf backend/internal/web/dist
          mkdir -p backend/internal/web/dist
          cp -r frontend/dist/* backend/internal/web/dist/
          echo "✅ 前端已就位 backend/internal/web/dist"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum

      - name: Build single binary (frontend embedded)
        id: build
        working-directory: backend
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          SUFFIX="${{ matrix.goos }}-${{ matrix.goarch }}"
          API="cloudctf-${SUFFIX}"
          mkdir -p ../release-bin
          go build -tags embed -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "../release-bin/${API}" ./cmd/server
          echo "suffix=$SUFFIX" >> $GITHUB_OUTPUT
          echo "✅ 单二进制构建完成: ${API} (前端已内嵌)"

      - name: Checksums
        working-directory: release-bin
        run: |
          for f in cloudctf-*; do
            sha256sum "$f" > "$f.sha256"
          done
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cloudctf-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            release-bin/cloudctf-*
          retention-days: 1

  # 在当前仓库创建 Release（仅 tag 触发）
  release:
    needs: [prepare, build-binaries]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: ls -la release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/cloudctf-*
