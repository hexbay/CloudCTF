name: Sync README to CloudCTF

on:
  push:
    branches:
      - main
    paths:
      - 'README.md'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: read

env:
  # CloudCTF 开源仓库，格式 owner/repo，请改成你的实际仓库
  CLOUDCTF_REPO: hexbay/CloudCTF

jobs:
  sync-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ctf-sass
        uses: actions/checkout@v4

      - name: Checkout CloudCTF
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CLOUDCTF_REPO }}
          token: ${{ secrets.CLOUDCTF_TOKEN }}
          path: cloudctf

      - name: Copy README
        run: |
          cp README.md cloudctf/README.md

      - name: Commit and push if changed
        working-directory: cloudctf
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "README 无变化，跳过同步"
            exit 0
          fi
          git add README.md
          git commit -m "docs: sync README from ctf-sass@${GITHUB_SHA::7}"
          git push
          echo "✅ README 已同步到 CloudCTF"
