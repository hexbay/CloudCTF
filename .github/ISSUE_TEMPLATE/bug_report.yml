name: Bug 报告
description: 报告可复现的问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 安全漏洞请按 SECURITY.md 私下报告，不要填写此表单。
  - type: input
    id: version
    attributes:
      label: 版本
      description: Release 版本或 commit SHA
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: 部署方式
      options: [单二进制, Docker, 源码运行, 其他]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 请先删除令牌、密码、Flag、IP 等敏感信息。
