name: Build and Release

on:
  push:
    tags:
      - 'v*'  # 当推送 tag 时触发，如 v1.0.0
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: read

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_IMAGE_PREFIX: ${{ secrets.DOCKER_USERNAME }}  # 修改为你的 Docker Hub 用户名
  # CloudCTF 开源仓库（仅发布二进制产物），格式 owner/repo，请改成你的实际仓库
  CLOUDCTF_REPO: hexbay/CloudCTF

jobs:
  # 提取版本号（其他 jobs 依赖）
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Extract version from tag
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=latest
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

  # 构建单一 Docker 镜像（多阶段：内嵌统一前端的 Go 二进制）
  build-image:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push server image (frontend embedded)
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_PREFIX }}/ctf-server:${{ needs.prepare.outputs.version }}
            ${{ env.DOCKER_IMAGE_PREFIX }}/ctf-server:latest
          platforms: linux/amd64
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE_PREFIX }}/ctf-server:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_IMAGE_PREFIX }}/ctf-server:buildcache,mode=max

  # 编译单一二进制产物（统一前端 embed 进 Go 二进制），多平台并行
  build-binaries:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build unified frontend
        run: |
          cd frontend
          npm ci
          npm run build
          echo "✅ 统一前端构建完成"

      - name: Embed frontend into backend
        run: |
          rm -rf backend/internal/web/dist
          mkdir -p backend/internal/web/dist
          cp -r frontend/dist/* backend/internal/web/dist/
          echo "✅ 前端已就位 backend/internal/web/dist"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: Build single binary (frontend embedded)
        id: build
        working-directory: backend
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          SUFFIX="${{ matrix.goos }}-${{ matrix.goarch }}"
          API="cloudctf-${SUFFIX}"
          mkdir -p ../release-bin
          go build -tags embed -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "../release-bin/${API}" ./cmd/server
          echo "suffix=$SUFFIX" >> $GITHUB_OUTPUT
          echo "✅ 单二进制构建完成: ${API} (前端已内嵌)"

      - name: Checksums
        working-directory: release-bin
        run: |
          for f in cloudctf-*; do
            sha256sum "$f" > "$f.sha256"
          done
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudctf-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            release-bin/cloudctf-*
          retention-days: 1

  # 同步产物到 CloudCTF 并创建 Release（仅 tag 触发）
  release-cloudctf:
    needs: [prepare, build-binaries]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: ls -la release-assets

      - name: Create Release on CloudCTF
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.CLOUDCTF_REPO }}
          token: ${{ secrets.CLOUDCTF_TOKEN }}
          tag_name: ${{ needs.prepare.outputs.version }}
          name: ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          files: |
            release-assets/cloudctf-*
