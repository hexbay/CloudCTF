name: CloudCTF CI

trigger:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

stages:
  - name: Test
    steps:
      - name: Backend tests
        run: |
          cd backend
          go test ./...

      - name: Frontend typecheck
        run: |
          cd frontend
          npm ci
          npm run typecheck

  - name: Build
    steps:
      - name: Frontend build
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Embedded backend binaries
        run: |
          cd backend
          rm -rf internal/web/dist
          cp -R ../frontend/dist internal/web/dist
          mkdir -p ../dist
          go build -tags embed -o ../dist/cloudctf-api ./cmd/server

      - name: Docker image
        run: |
          docker build -f backend/Dockerfile -t cloudctf:ci .
